<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cloud-r2pan</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
  padding: 24px 24px 84px; color: #fff; position: relative;
  background: linear-gradient(160deg, #0b1026 0%, #1a1240 45%, #2a1045 100%);
  -webkit-tap-highlight-color: transparent;
}
.orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5; pointer-events: none; animation: drift 18s ease-in-out infinite alternate; }
.o1 { width: 46vmax; height: 46vmax; background: #38bdf8; top: -18%; left: -14%; }
.o2 { width: 40vmax; height: 40vmax; background: #8b5cf6; bottom: -20%; right: -10%; animation-delay: -6s; }
.o3 { width: 30vmax; height: 30vmax; background: #ec4899; top: 55%; left: 8%; animation-delay: -12s; opacity: .35; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vw, -5vh) scale(1.12); } }

.card {
  position: relative; width: 100%; max-width: 440px; margin: auto 0; flex: none;
  padding: 48px 36px 40px; border-radius: 36px; text-align: center;
  background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
  backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid rgba(255,255,255,.28);
  box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
  animation: rise .65s cubic-bezier(.22,1.2,.36,1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.95); } to { opacity: 1; transform: none; } }

.file-icon {
  width: 104px; height: 104px; margin: 0 auto 24px; border-radius: 30px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.08));
  border: 1px solid rgba(255,255,255,.32);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 14px 34px rgba(0,0,0,.35);
  position: relative; overflow: hidden;
}
.file-icon::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 48%, transparent 62%);
  transform: translateX(-120%); animation: shine 4.5s ease-in-out infinite;
}
@keyframes shine { 0%, 60% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
.file-icon .ext { font-size: 26px; font-weight: 800; letter-spacing: -.02em; text-shadow: 0 2px 8px rgba(0,0,0,.25); }

/* 批量分享：头部压缩（图标缩小、标题单行），让文件列表优先露出 */
.card.batch .file-icon { width: 68px; height: 68px; margin-bottom: 14px; border-radius: 20px; }
.card.batch .file-icon .ext { font-size: 17px; }
.card.batch h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 小屏：卡片收紧，给内容腾地方 */
@media (max-width: 480px){
  body { padding: 14px 14px 84px; }
  .card { padding: 30px 20px 26px; border-radius: 28px; }
}

h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; word-break: break-all; line-height: 1.35; }
.meta { margin-top: 10px; font-size: 14px; color: rgba(255,255,255,.72); display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.meta .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.4); }

.stats { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
.stat {
  flex: 0 1 150px; padding: 6px 4px; border-radius: 12px;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
}
.stat .v { font-size: 13.5px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .k { margin-top: 1px; font-size: 10px; color: rgba(255,255,255,.6); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; margin-top: 28px; padding: 17px; border: none; border-radius: 22px;
  font-size: 17px; font-weight: 650; letter-spacing: -.01em; color: #fff; cursor: pointer;
  background: linear-gradient(180deg, #3d9bff, #0a7cff);
  box-shadow: 0 12px 30px rgba(10,124,255,.42), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .15s cubic-bezier(.22,1.2,.36,1), box-shadow .2s;
  text-decoration: none; -webkit-user-select: none; user-select: none;
}
.btn:hover { transform: translateY(-1px) scale(1.01); }
.btn:active { transform: scale(.97); }
.btn svg { width: 19px; height: 19px; }

.hint { margin-top: 14px; font-size: 12.5px; color: rgba(255,255,255,.55); line-height: 1.6; }

.warn { margin-top: 18px; padding: 13px 16px; border-radius: 16px; font-size: 13.5px; line-height: 1.55;
  background: rgba(255,159,10,.14); border: 1px solid rgba(255,159,10,.35); color: #ffd9a0; }

.loading { padding: 80px 0; text-align: center; }
.spinner { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.18); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.brand { position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
  font-size: 13px; color: rgba(255,255,255,.4); letter-spacing: .08em; }
.brand b { font-weight: 650; }
.lang-btn { margin-left: 10px; padding: 4px 13px; border-radius: 11px; border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.75); font-size: 12px; font-family: inherit;
  letter-spacing: 0; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: all .2s; vertical-align: 1px; }
.lang-btn:hover { background: rgba(255,255,255,.2); color: #fff; }

/* GitHub Octocat 悬浮按钮 */
.octo-float {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(20px, env(safe-area-inset-bottom));
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.05));
  border: 1px solid rgba(255,255,255,.28);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; text-decoration: none; z-index: 50;
  box-shadow: 0 8px 22px rgba(0,0,0,.35);
  transition: transform .25s cubic-bezier(.22,1.2,.36,1), box-shadow .25s;
}
.octo-float:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.octo-float svg { width: 22px; height: 22px; color: #fff; }

.pw { margin-top: 6px; }
.pw input {
  width: 100%; margin-top: 22px; padding: 16px; border-radius: 16px; text-align: center;
  font-size: 17px; font-family: inherit; color: #fff; outline: none;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.28);
}
.pw input::placeholder { color: rgba(255,255,255,.45); }
.pw input:focus { border-color: #3d9bff; }
.pw .err { margin-top: 10px; font-size: 13px; color: #ff8480; min-height: 18px; }
.pw .pw-hint { margin-top: 12px; font-size: 12.5px; color: rgba(255,255,255,.55); }
.pw.shake input { animation: shake .5s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }

/* Turnstile */
.ts-wrap {
  width: 100%; margin-top: 22px; display: flex; justify-content: center;
}
.ts-wrap div, .ts-wrap iframe { border-radius: 14px !important; }
.ts-passed {
  width: 100%; margin-top: 22px; padding: 14px; border-radius: 16px;
  background: rgba(110,231,183,.15); border: 1px solid rgba(110,231,183,.4);
  color: #6ee7b7; font-size: 14px; text-align: center; font-weight: 600;
}
.ts-blocked-title { margin-top: 22px; font-size: 14px; color: #fde68a; font-weight: 600; }
.ts-blocked-hint { margin-top: 6px; font-size: 12.5px; color: rgba(255,255,255,.6); line-height: 1.6; }

/* ═══════ 激活码浮动按钮 ═══════ */
.code-float {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(10,132,255,.25), rgba(10,132,255,.1));
  border: 1px solid rgba(10,132,255,.45);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 50;
  box-shadow: 0 8px 22px rgba(10,132,255,.25);
  transition: transform .25s cubic-bezier(.22,1.2,.36,1), box-shadow .25s;
}
.code-float.position-right {
  left: auto;
  right: max(16px, env(safe-area-inset-right));
}
.code-float:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 12px 30px rgba(10,132,255,.35); }
.code-float svg { width: 22px; height: 22px; color: #a5d8ff; }
.code-float .badge {
  position: absolute; top: -2px; right: -2px; width: 12px; height: 12px;
  border-radius: 50%; background: #34d399; border: 2px solid #0b1026;
}

/* ═══════ 激活码弹窗 ═══════ */
.code-modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.code-modal {
  width: min(400px, 92vw); padding: 26px 24px 22px; border-radius: 28px;
  background: linear-gradient(160deg, rgba(30,28,60,.95), rgba(15,13,38,.96));
  backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(255,255,255,.2);
  box-shadow: 0 -20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
  animation: sheetUp .35s cubic-bezier(.22,1.1,.36,1) both;
}
@keyframes sheetUp { from { transform: translateY(40px) scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }
.code-modal h3 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.code-modal .sub { font-size: 12.5px; color: rgba(255,255,255,.5); margin-top: 4px; }
.code-modal .close {
  position: absolute; top: 14px; right: 14px; width: 30px; height: 30px;
  border-radius: 50%; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.6); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.code-modal .close:hover { background: rgba(255,255,255,.15); color: #fff; }
.code-bound-row {
  margin-top: 16px; padding: 14px 16px; border-radius: 16px;
  background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.35);
}
.code-bound-row .label { font-size: 11px; color: rgba(110,231,183,.8); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.code-bound-row .code { font-family: ui-monospace,'SF Mono',monospace; font-size: 14px; color: #6ee7b7; margin-top: 4px; letter-spacing: .03em; }
.code-bound-row .detail { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
.code-bound-row .unbind-btn {
  padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06); color: rgba(255,255,255,.7); font-size: 12px;
  cursor: pointer; transition: all .15s;
}
.code-bound-row .unbind-btn:hover { background: rgba(255,69,58,.15); border-color: rgba(255,69,58,.4); color: #ffb3ae; }
.code-input-row {
  margin-top: 18px; display: flex; flex-direction: column; gap: 10px;
}
.code-input-row input {
  width: 100%; padding: 13px 16px; border-radius: 14px; font-size: 14px;
  font-family: ui-monospace,'SF Mono',monospace; color: #fff; outline: none;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
  letter-spacing: .04em; text-align: center;
}
.code-input-row input:focus { border-color: #3d9bff; background: rgba(255,255,255,.12); }
.code-input-row input::placeholder { color: rgba(255,255,255,.35); }
.code-btn-row { display: flex; gap: 10px; }
.code-btn-row button {
  flex: 1; padding: 12px 14px; border-radius: 13px; border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08); color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s; font-family: inherit;
}
.code-btn-row button:hover { background: rgba(255,255,255,.15); }
.code-btn-row button.primary {
  background: linear-gradient(180deg,#3d9bff,#0a7cff); border-color: transparent;
  box-shadow: 0 6px 16px rgba(10,124,255,.3);
}
.code-btn-row button.primary:hover { filter: brightness(1.06); }
.code-query-result {
  margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 13px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.8); min-height: 20px;
}
.code-query-result.ok { background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.35); color: #6ee7b7; }
.code-query-result.warn { background: rgba(255,159,10,.12); border-color: rgba(255,159,10,.35); color: #fcd34d; }
.code-query-result.err { background: rgba(255,69,58,.12); border-color: rgba(255,69,58,.35); color: #fda293; }
.code-progress { margin-top: 8px; height: 3px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
.code-progress i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg,#34d399,#60a5fa); }

/* ═══════ ⚡ 加速下载（页内分段引擎，从实验室定版搬入） ═══════ */
.hidden { display: none !important; }
.fast-btn { padding: 6px 10px; border-radius: 8px; border: none; cursor: pointer; white-space: nowrap;
  background: linear-gradient(180deg,#f7bd45,#f08c0a); color: #231500; font-weight: 700; font-size: 12.5px; font-family: inherit;
  box-shadow: 0 6px 16px rgba(240,140,10,.4), inset 0 1px 0 rgba(255,255,255,.45); }
.fast-btn:active { transform: scale(.96); }
.btn.fast { background: linear-gradient(180deg,#f7bd45,#f08c0a); color: #231500;
  box-shadow: 0 12px 30px rgba(240,140,10,.35), inset 0 1px 0 rgba(255,255,255,.5); }
.btn.fast.small { width: 72%; margin: 12px auto 0; padding: 11px; font-size: 14.5px; border-radius: 16px; }
.fast-card { width: 100%; margin-top: 22px; padding: 18px; border-radius: 20px; text-align: left;
  background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.05));
  border: 1px solid rgba(255,255,255,.22);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.fast-card .fc-name { font-size: 15px; font-weight: 650; word-break: break-all; }
.fast-card .fc-badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; margin-left: 8px; vertical-align: 2px;
  background: rgba(52,211,153,.18); color: #6ee7b7; border: 1px solid rgba(52,211,153,.4); }
.fast-card .fc-bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin: 12px 0; }
.fast-card .fc-bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg,#38bdf8,#818cf8); transition: width .2s; }
.fast-card .fc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; color: rgba(255,255,255,.85); font-variant-numeric: tabular-nums; }
.fast-card .fc-btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.fast-card .fc-btns button { flex: 1; min-width: 110px; padding: 12px; border-radius: 14px; cursor: pointer; font-family: inherit;
  border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; font-size: 14px; font-weight: 600; }
.fast-card .fc-btns button.primary { background: linear-gradient(180deg,#3d9bff,#0a7cff); border-color: transparent; }
.fast-card .fc-btns button.alt { background: linear-gradient(180deg,#f7bd45,#f08c0a); color: #231500; border-color: transparent; }
.fast-card .fc-btns button.danger { background: rgba(255,69,58,.18); border-color: rgba(255,69,58,.4); }
.fast-card .fc-note { margin-top: 10px; font-size: 12.5px; color: #ffd9a0; line-height: 1.6; }
</style>
</head>

<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="card" id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div style="font-size:14px;color:rgba(255,255,255,.65)" id="loading-text"></div>
  </div>
</div>

<div class="brand"><span id="brand-text">Powered by <b>cloud-r2pan</b></span><button class="lang-btn" id="lang-toggle"></button></div>

<!-- GitHub Octocat 悬浮（仅图标装饰，2026-10-20 CAI 指示去掉外链） -->
<span class="octo-float" aria-hidden="true">
  <!-- Octocat silhouette — GitHub 官方吉祥物 -->

<script>
/* ═══════════ i18n ═══════════ */
const I18N = {
  zh: {

    switchTo: 'EN',
    // Turnstile
    turnstileBlocked: '🛡️ 需要完成人机验证',
    turnstileHint: '该链接被管理员设为需要验证，请完成下方的人机检查后继续下载',

    turnstilePass: '验证通过 ✓',

    turnstileDownloadNow: '立即下载',
    // OAuth2
    oauthLogin: '使用 {provider} 登录',
    oauthLoggedInAs: '已登录 {provider}',
    oauthLogout: '退出',

/** 语言检测：手动选择 > 浏览器首选语言 > 时区（大中华区） > 英文 */
function detectLang(){
  try {
    const saved = localStorage.getItem('cd_lang');
    if (saved === 'zh' || saved === 'en') return saved;
  } catch {}
  const first = String((navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language) || '').toLowerCase();
  if (first.startsWith('zh')) return 'zh';
  if (first) return 'en';
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (/^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar|Hong_Kong|Macau|Taipei)$/.test(tz)) return 'zh';
  } catch {}
  return 'en';
}

let LANG = detectLang();
const t = (key, params) => {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  return s;
};

document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
$('#loading-text').textContent = t('loading');
$('#lang-toggle').textContent = t('switchTo');
$('#lang-toggle').onclick = () => {
  try { localStorage.setItem('cd_lang', LANG === 'zh' ? 'en' : 'zh'); } catch {}
  location.reload();
};

const EXT_COLORS = {
  zip:'#ffb340', rar:'#ffb340', '7z':'#ffb340', tar:'#ffb340', gz:'#ffb340',
  pdf:'#ff6961', doc:'#5b9cf5', docx:'#5b9cf5', txt:'#9aa4b2', md:'#9aa4b2',
  xls:'#3ecf8e', xlsx:'#3ecf8e', csv:'#3ecf8e', ppt:'#ff9f0a', pptx:'#ff9f0a',
  mp3:'#bf5af2', wav:'#bf5af2', flac:'#bf5af2', m4a:'#bf5af2',
  mp4:'#ff453a', mov:'#ff453a', mkv:'#ff453a', avi:'#ff453a',
  png:'#30d158', jpg:'#30d158', jpeg:'#30d158', gif:'#30d158', webp:'#30d158', svg:'#30d158',
  apk:'#3ecf8e', exe:'#9aa4b2', iso:'#9aa4b2', dmg:'#9aa4b2', default:'#8ea0c8'
};
function extOf(name){ const m=/\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():''; }
function extColor(name){ return EXT_COLORS[extOf(name)]||EXT_COLORS.default; }
function fmtSize(n){
  if(!Number.isFinite(n))return '—';
  if(n<1024)return n+' B';
  const u=['KB','MB','GB','TB'];let i=-1;
  do{n/=1024;i++;}while(n>=1024&&i<u.length-1);
  return n.toFixed(n>=100?0:n>=10?1:2)+' '+u[i];
}
function fmtTime(ts){
  const d=new Date(ts),p=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function getBoundCode(){ try { return localStorage.getItem('r2pan_code')?.trim().toUpperCase() || null; } catch { return null; } }
function setBoundCode(c){ try { if(c) localStorage.setItem('r2pan_code', c.trim().toUpperCase()); else localStorage.removeItem('r2pan_code'); } catch {} }

const token = location.pathname.split('/')[2];

let TURSTILE_LOADED = false, turnstileReady = false, pendingCb = null;
function loadTurnstileScript(onload){
  if(TURSTILE_LOADED){ if(window.turnstile){ window.turnstile.ready(cb=>{ turnstileReady = true; onload&&onload(cb); }); } return; }
  TURSTILE_LOADED = true;
  window.onTurnstileLoad = () => { turnstileReady = true; onload && onload(window.turnstile); };
  const s = document.createElement('script');
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad';
  s.async = true; s.defer = true;
  document.head.appendChild(s);
}

/**
 * 渲染 Turnstile widget 并等待完成。
 * 返回 Promise<string> —— token 字符串。
 */
async function renderTurnstile(containerEl, sitekey){
  containerEl.innerHTML = '<div class="ts-wrap"><div class="ts-box" data-sitekey="'+sitekey+'"></div></div>';
  loadTurnstileScript();
  // 等待 window.turnstile 出现
  await new Promise(resolve => {
    const check = () => { if(window.turnstile){ resolve(); } else { setTimeout(check, 80); } };
    check();
  });
  return await new Promise((resolve, reject) => {
    const id = window.turnstile.render(containerEl.querySelector('.ts-box'), {
      sitekey,
      theme: 'auto',
      callback: (tk) => resolve(tk),
      'error-callback': () => reject(new Error('ts_error')),
      'timeout-callback': () => reject(new Error('ts_timeout')),
    });
    containerEl.dataset.tsWidgetId = id;
  });
}

async function boot(){
  // OAuth callback 返回的错误参数 → 页面顶部提示
  const params = new URLSearchParams(location.search);
  const oauthErr = params.get('oauth_error');

  let info;
  let oauthProviders = [];
  try{
    const r = await fetch(`/s/${token}/info`, {cache:'no-store'});
    if(!r.ok) throw 0;
    info = await r.json();
  }catch{ renderError(t('notFoundTitle'), t('notFoundMsg')); return; }
  // 如果 OAuth2 启用了，拉启用中的 Provider 列表来渲染多个按钮
  if (info.oauth?.enabled) {
    try {
      const r2 = await fetch('/oauth/providers', {cache:'no-store'});
      if (r2.ok) {
        const j = await r2.json();
        oauthProviders = j.providers || [];
      }
    } catch {}
  }
  const siteName = info.site_title || 'cloud-r2pan';
  document.title = t('pageTitle', {site: siteName});
  $('#brand-text').innerHTML = `Powered by <b>${esc(siteName)}</b>`;
  render(info, siteName, oauthErr, oauthProviders);
}

function renderError(title,msg){
  $('#app').innerHTML = `
    <div class="file-icon" style="font-size:44px">🚫</div>

}

  const statusColorMap = { unused: '#9aa4b2', active: '#60a5fa', revoked: '#a3a3a3', expired: '#fbbf24', exhausted: '#f87171' };

async function triggerDownload(d, ts, tsEnabled, tsOnDownload){
  const baseUrl = `/s/${token}/download`;
  // 读取已绑定的激活码（从 localStorage）
  const code = getBoundCode();
  // both / on_download 模式：先确保有 token
  if(tsEnabled && tsOnDownload){
    let tk = window.__tsToken;
    if(!tk){
      // 还没渲染过 → 现在渲染
      const box = document.createElement('div');
      box.style.cssText = 'margin-top:20px';
      document.body.appendChild(box);
      try{
        tk = await renderTurnstile(box, ts.sitekey);
        window.__tsToken = tk;
        box.remove();
      }catch{ box.remove(); return; }
    }
    let url = `${baseUrl}?cf=${tk}`;
    if(code) url += `&code=${encodeURIComponent(code)}`;
    location.href = url;
  } else {
    let url = baseUrl;
    if(code) url += `?code=${encodeURIComponent(code)}`;
    location.href = url;
  }
}

async function wireUnlock(d, ts, tsEnabled, tsOnDownload){
  const btn = $('#pw-go'), input = $('#pw'), err = $('#pw-err');
  const unlock = async () => {
    const pass = input.value;
    if(!pass) return;
    // 读取已绑定的激活码（从 localStorage）
    const code = getBoundCode();
    btn.style.pointerEvents = 'none'; btn.style.opacity = '.6';
    err.textContent = '';
    // both 模式：需要 Turnstile token
    let turnstileToken = null;
    if(tsEnabled && ts.mode === 'both'){
      let tk = window.__tsToken;
      if(!tk){
        const box = document.createElement('div');
        box.style.cssText = 'margin-top:14px';
        document.getElementById('pw-box').appendChild(box);
        try{
          tk = await renderTurnstile(box, ts.sitekey);
          window.__tsToken = tk;
          box.innerHTML = `<div class="ts-passed">${esc(t('turnstilePass'))}</div>`;
        }catch(e){ box.remove(); err.textContent = t('turnstileFail'); btn.style.pointerEvents = ''; btn.style.opacity = ''; return; }
      }
      turnstileToken = tk;
    }
    try{
      const body = { password: pass };
      if(turnstileToken) body.turnstile = turnstileToken;
      const r = await fetch(`/s/${token}/verify`, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
      let res = {};
      try{ res = await r.json(); }catch{}
      if(r.ok && res.url){
        // 批量分享：把解锁票据补到每个文件的下载按钮上，否则逐个下载会 403 需要密码
        try {
          const ticket = new URL(res.url, location.origin).searchParams.get('t');
          if(ticket){
            document.querySelectorAll('[data-dl-file]').forEach(a => {
              let u = `/s/${token}/download?file=${encodeURIComponent(a.getAttribute('data-dl-file'))}&t=${ticket}`;
              if(code) u += '&code=' + encodeURIComponent(code);
              a.setAttribute('href', u);
            });
          }
        } catch {}
        // on_download 模式需要 cf 参数
        if(tsEnabled && tsOnDownload && !res.url.includes('cf=')){
          let tk = window.__tsToken;
          if(!tk){
            const box = document.createElement('div');
            box.style.cssText = 'margin-top:14px';
            document.getElementById('pw-box').appendChild(box);
            tk = await renderTurnstile(box, ts.sitekey);
            window.__tsToken = tk;
            box.innerHTML = `<div class="ts-passed">${esc(t('turnstilePass'))}</div>`;
          }
          const sep = res.url.includes('?') ? '&' : '?';
          let dlUrl = res.url + sep + 'cf=' + tk;
          if(code){ const s2 = dlUrl.includes('?') ? '&' : '?'; dlUrl += s2 + 'code=' + encodeURIComponent(code); }
          location.href = dlUrl;
        } else {
          let dlUrl = res.url;
          if(code){ const s2 = dlUrl.includes('?') ? '&' : '?'; dlUrl += s2 + 'code=' + encodeURIComponent(code); }
          location.href = dlUrl;
        }
        return;
      }
      err.textContent = t(res.error === 'bad_password' ? 'wrongPassword' : 'wrongPassword');
      $('#pw-box').classList.remove('shake'); void $('#pw-box').offsetWidth; $('#pw-box').classList.add('shake');
      input.select();
    }catch{
      err.textContent = t('wrongPassword');
    }
    btn.style.pointerEvents = ''; btn.style.opacity = '';
  };
  btn.onclick = unlock;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
}

/* ═══════════ ⚡ 加速下载引擎（页内分段下载） ═══════════
   通道：IndexedDB 中转 → OPFS 直写盘 → 内存拼装（小文件）→ 都不行则提示走普通下载。降级拉黑只配给通道真死（2026-10-21 CAI 定）：写手卡死/写入/拼装出错才降级，坏到内存级才找用户；拉黑在本浏览器本地跨次保留 3 天（三条通道同规、到期自动失效，永久不保险），堵到没路就走普通下载——那一直是兜底；网络错不降级——fetch 按停滞判死（字节在动就放行、20 秒不动才掐），整轮网络失败停成暂停、账本与进度保留待续。写入带看门狗超时，卡死不报错同样判坏（百度实测 OPFS 会卡住不报错、取消也掐不断）。
   库存认领（呆瓜-proof，2026-10-21 CAI 定）：OPFS/IDB 两条硬盘通道的进度记进账本
   （localStorage），关页面/被杀后 1 小时内回来点⚡可续传；下完忘存的也能认领回
   来直接保存。库存保质期 1 小时、保存后 3 分钟自动清——宁可重下，不长占手机。
   内存通道不落盘、无法续传。文件大小对不上（被换过）一律清账重下。 */
function dlUrlFor(fileId){
  let u = "/s/" + token + "/download";
  if(fileId) u += "?file=" + encodeURIComponent(fileId);
  return u;
}
function guessMime(name){
  const ext = (name.split(".").pop() || "").toLowerCase();
  const map = { mp4: "video/mp4", mkv: "video/x-matroska", mov: "video/quicktime", webm: "video/webm",
    mp3: "audio/mpeg", m4a: "audio/mp4", wav: "audio/wav", flac: "audio/flac",
    jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif", webp: "image/webp",
    pdf: "application/pdf", zip: "application/zip", rar: "application/vnd.rar", "7z": "application/x-7z-compressed" };
  return map[ext] || "application/octet-stream";
}
const FC = s => document.getElementById(s);
const SEG_SIZE = 4 * 1048576, CONC = 6;
const ACCEL_TTL = 1 * 3600 * 1000;
const AUTOCLEAN_MS = 3 * 60 * 1000;

/* —— 账本（库存清单） —— */
const MF_KEY = "r2pan_accel_v1";
function mfLoad(){ try { const j = JSON.parse(localStorage.getItem(MF_KEY) || "null"); return (j && j.v === 1) ? j : null; } catch { return null; } }
function mfSave(m){ try { if(m) localStorage.setItem(MF_KEY, JSON.stringify(m)); else localStorage.removeItem(MF_KEY); } catch {} }
/* 通道拉黑（跨次记忆，2026-10-21 CAI 定 3 天）：某通道真死过一次，这个浏览器 3 天内选通道直接跳过它，
   省得每次下载都撞墙白等；到期自动失效重试，永久拉黑不保险。只存本浏览器本地，绝不按 IP 上服务器
   （兄弟们共用出口 IP，按 IP 记会连坐）。三条通道同规，没有豁免；三条都指望不上时兜底是普通下载 */
const CHANBAN_KEY = "r2pan_chanban_v1";
const CHANBAN_TTL = 3 * 24 * 3600 * 1000;
const CHANBAN_KIND = { "OPFS 直写盘": "opfs", "IndexedDB 中转": "idb", "内存拼装": "mem" };
function chanBanLoad(){
  try {
    const j = JSON.parse(localStorage.getItem(CHANBAN_KEY) || "{}");
    const now = Date.now(), out = new Set();
    for(const kind of Object.keys(CHANBAN_KIND)) if(j[CHANBAN_KIND[kind]] && now - j[CHANBAN_KIND[kind]] < CHANBAN_TTL) out.add(kind);
    return out;
  } catch { return new Set(); }
}
function chanBanStamp(kindName){
  const key = CHANBAN_KIND[kindName];
  if(!key) return;
  try {
    const j = JSON.parse(localStorage.getItem(CHANBAN_KEY) || "{}");
    j[key] = Date.now();
    localStorage.setItem(CHANBAN_KEY, JSON.stringify(j));
  } catch {}
}
function fileKeyOf(fileId){ return token + ":" + (fileId || "single"); }
function fnameOf(key){ let h = 0; for(let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0; return "accel-" + h.toString(36) + ".part"; }
async function mfWipe(m){
  if(!m) return;
  try {
    if(m.channel === "opfs"){ const w = new FcOpfsWriter(m.fname); await w.discard(); }
    else if(m.channel === "idb"){ const w = new FcIdbWriter(); await w.open(true); await w.discard(); }
  } catch {}
  mfSave(null);
}

/* —— IndexedDB 工具 —— */
function idbOpen2(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open("r2pan-accel", 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore("chunks"); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function idbPut2(db, key, blob){
  return new Promise((res, rej) => {
    const tx = db.transaction("chunks", "readwrite");
    tx.objectStore("chunks").put(blob, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
function idbGet2(db, key){
  return new Promise((res, rej) => {
    const rq = db.transaction("chunks", "readonly").objectStore("chunks").get(key);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });
}
function idbKeys2(db){
  return new Promise((res, rej) => {
    const rq = db.transaction("chunks", "readonly").objectStore("chunks").getAllKeys();
    rq.onsuccess = () => res(rq.result || []);
    rq.onerror = () => rej(rq.error);
  });
}
function idbClear2(db){
  return new Promise((res, rej) => {
    const tx = db.transaction("chunks", "readwrite");
    tx.objectStore("chunks").clear();
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

/* —— OPFS 写入器（协议与实验室一致：type open/openkeep/write/finish/abort） —— */
class FcOpfsWriter {
  constructor(fname){
    this.kind = "OPFS 直写盘";
    this.fname = fname;
    this.seq = 0;
    this._deadErr = null;
    this.pending = new Map();
    this.worker = new Worker("/dlab-worker.js");
    this.worker.onerror = ev => { this.kill(new Error("写入小工出错：" + (ev.message || "脚本加载失败"))); };
    this.worker.onmessage = e => {
      const m = e.data || {};
      if(m.type === "written"){ const p = this.pending.get(m.id); if(p){ this.pending.delete(m.id); p.res(m.len); } }
      else if(m.type === "error"){
        const p = m.id != null ? this.pending.get(m.id) : null;
        if(p){ this.pending.delete(m.id); p.rej(new Error(m.msg)); }
        if(this.openRej){ this.openRej(new Error(m.msg)); this.openRej = null; }
        if(this.finishRej){ this.finishRej(new Error(m.msg)); this.finishRej = null; }
      }
      else if(m.type === "opened"){ if(this.openRes){ this.openRes(); this.openRes = null; } }
      else if(m.type === "done"){ if(this.finishRes){ this.finishRes(); this.finishRes = null; } }
    };
  }
  /* 整器作废：把所有等回音的调用一次性判死并杀掉小工（卡死/取消共用） */
  kill(err){
    if(this._deadErr) return;
    this._deadErr = err || new Error("OPFS 写入器失效");
    if(this.openRej){ this.openRej(this._deadErr); this.openRej = null; this.openRes = null; }
    if(this.finishRej){ this.finishRej(this._deadErr); this.finishRej = null; this.finishRes = null; }
    for(const p of this.pending.values()) p.rej(this._deadErr);
    this.pending.clear();
    try { this.worker.terminate(); } catch {}
  }
  open(keep){
    return new Promise((res, rej) => {
      const timer = setTimeout(() => { if(this.openRej){ this.openRej(new Error("OPFS 打开超时")); this.openRej = null; this.openRes = null; } }, 18000);
      this.openRes = () => { clearTimeout(timer); res(); };
      this.openRej = e => { clearTimeout(timer); rej(e); };
      this.worker.postMessage({ type: keep ? "openkeep" : "open", name: this.fname });
    });
  }
  writeAt(offset, buf){
    if(this._deadErr) return Promise.reject(this._deadErr);
    const id = ++this.seq;
    /* 15 秒没回音就判定小工卡死：整器作废走降级，不能干等 */
    return new Promise((res, rej) => {
      const to = setTimeout(() => this.kill(new Error("OPFS 写入超时")), 15000);
      this.pending.set(id, { res: v => { clearTimeout(to); res(v); }, rej: e => { clearTimeout(to); rej(e); } });
      this.worker.postMessage({ type: "write", id, offset, buf }, [buf]);
    });
  }
  finish(){
    if(this._deadErr) return Promise.reject(this._deadErr);
    return new Promise((res, rej) => {
      const to = setTimeout(() => this.kill(new Error("OPFS 收尾超时")), 20000);
      this.finishRes = () => { clearTimeout(to); res(); };
      this.finishRej = e => { clearTimeout(to); rej(e); };
      this.worker.postMessage({ type: "finish" });
    });
  }
  async getFile(){
    const root = await navigator.storage.getDirectory();
    const h = await root.getFileHandle(this.fname);
    return await h.getFile();
  }
  async discard(){
    try { this.worker.postMessage({ type: "abort", name: this.fname }); } catch {}
    await new Promise(r => setTimeout(r, 350));
    try { this.worker.terminate(); } catch {}
    try { const root = await navigator.storage.getDirectory(); await root.removeEntry(this.fname); } catch {}
  }
  async close(){ try { this.worker.terminate(); } catch {} }
}
/* —— IndexedDB 写入器（按段号存，续传靠查钥匙对账） —— */
class FcIdbWriter {
  constructor(){ this.kind = "IndexedDB 中转"; this.db = null; }
  async open(resume){ this.db = await idbOpen2(); if(!resume) await idbClear2(this.db); }
  async presentKeys(){ return await idbKeys2(this.db); }
  async writeAt(offset, buf){ await Promise.race([idbPut2(this.db, offset / SEG_SIZE, new Blob([buf])), new Promise((_, rej) => setTimeout(() => rej(new Error("IndexedDB 写入超时")), 20000))]); }
  async finish(){}
  async getFile(name, type){
    const keys = await idbKeys2(this.db);
    const parts = [];
    for(let i = 0; i < keys.length; i++){
      if(keys[i] !== i) throw new Error("分段缺失，拼装失败");
      parts.push(await idbGet2(this.db, i));
    }
    if(parts.some(p => !p)) throw new Error("分段缺失，拼装失败");
    return new File(parts, name, { type: type || "application/octet-stream" });
  }
  async discard(){ if(this.db){ await idbClear2(this.db); try { this.db.close(); } catch {} this.db = null; } }
  async close(){ if(this.db){ try { this.db.close(); } catch {} this.db = null; } }
}
/* —— 内存写入器（不落盘，关页面即没，不可续传） —— */
class FcMemWriter {
  constructor(){ this.kind = "内存拼装"; this.map = new Map(); }
  async open(){}
  async writeAt(offset, buf){ this.map.set(offset, buf); }
  async finish(){}
  async getFile(name, type){
    const keys = [...this.map.keys()].sort((a, b) => a - b);
    return new File(keys.map(k => this.map.get(k)), name, { type: type || "application/octet-stream" });
  }
  async discard(){ this.map.clear(); }
  async close(){}
}

/* —— 屏幕常亮 & 离开拦截（防中断） —— */
let wakeLock = null;
async function wlOn(){ try { wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
function wlOff(){ try { if(wakeLock) wakeLock.release(); } catch {} wakeLock = null; }
const leaveGuard = e => { e.preventDefault(); e.returnValue = ""; };
function fmtDur(s){
  s = Math.max(1, Math.round(s));
  if(s < 60) return s + " 秒";
  const m = Math.floor(s / 60), r = s % 60;
  return r ? m + " 分 " + r + " 秒" : m + " 分钟";
}
function fmtSpeed(bps){ return bps > 0 ? fmtSize(bps) + "/s" : "—"; }

/* —— 进度卡状态 —— */
let fcCurrent = null; // 正在跑或已下完待保存的状态
function note(t){ const n = FC("fc-note"); n.textContent = t; n.classList.remove("hidden"); }
function showCard(f){
  FC("fast-card").classList.remove("hidden");
  FC("fc-name").textContent = f.name;
  for(const id of ["fc-cancel", "fc-clean", "fc-save", "fc-save-alt", "fc-fallback", "fc-go", "fc-no"]) FC(id).classList.add("hidden");
  FC("fc-fill").style.width = "0%";
  FC("fc-pct").textContent = "0.0%"; FC("fc-got").textContent = "0 B"; FC("fc-cur").textContent = "-";
  FC("fc-avg").textContent = "-"; FC("fc-time").textContent = "0s"; FC("fc-seg").textContent = "0/0";
  FC("fast-card").scrollIntoView({ behavior: "smooth", block: "center" });
}
function failNote(f, mf, fileId, isNet){
  if(isNet && mf) note("网络断了或者太不稳，这次先停在这儿——放心，下好的部分都留着（1 小时内有效），网络好了点「继续下载」就能接着下，不用从头来。也可以点下面按钮用普通方式下。");
  else if(isNet) note("网络断了或者太不稳，这次加速没成功。等等网络好了再点⚡试试，或者点下面蓝按钮用普通方式下这个文件（慢一点，但稳）。");
  else note("⚠️ 这次加速没成功，不用等了。" + (mf ? "点「继续下载」能从下好的地方接着下；也可以点下面按钮用普通方式下这个文件（慢一点，但稳）。" : "点下面蓝按钮用普通方式下这个文件（慢一点，但稳）。"));
  const fb = FC("fc-fallback");
  fb.textContent = "用普通下载这个文件";
  fb.classList.remove("hidden");
  fb.onclick = () => { location.href = f.url; };
  if(mf){
    const go = FC("fc-go");
    go.textContent = "继续下载";
    go.classList.remove("hidden");
    go.onclick = () => { go.classList.add("hidden"); fb.classList.add("hidden"); runDownload(f, fileId, mf); };
  }
}

/* —— 保存环节（下完/认领共用） —— */
function presentSave(st){
  const { f, writer } = st;
  let armed = false;
  const arm = () => {
    if(armed) return;
    armed = true;
    setTimeout(async () => {
      const m = mfLoad();
      if(st.mf && m && m.key === st.mf.key) await mfWipe(m);
      else if(!st.mf){ try { await writer.discard(); } catch {} }
      if(fcCurrent === st) fcCurrent = null;
      for(const id of ["fc-clean", "fc-save", "fc-save-alt"]) FC(id).classList.add("hidden");
      note("✅ 已经保存好了，临时文件也自动清理干净了。");
    }, AUTOCLEAN_MS);
  };
  const ensure = async () => {
    if(!st.file) st.file = await writer.getFile(f.name, f.mime);
    return st.file;
  };
  const sb = FC("fc-save"), sbAlt = FC("fc-save-alt"), sc = FC("fc-clean");
  sb.classList.remove("hidden"); sbAlt.classList.remove("hidden"); sc.classList.remove("hidden");
  sb.onclick = async () => {
    try {
      const raw = await ensure();
      const blob = raw.type === "application/octet-stream" ? raw : new Blob([raw], { type: "application/octet-stream" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      arm();
    } catch { note("保存没成功，再点一次「保存文件」试试。"); }
  };
  sbAlt.onclick = async () => {
    try {
      const raw = await ensure();
      const blob = raw.type === "application/octet-stream" ? raw : new Blob([raw], { type: "application/octet-stream" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = f.name + ".dl";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      note("开始存了（备用方式）。存好以后要改个名才能打开，照着做很简单：① 打开手机的「文件管理」② 找到刚存的、结尾多了 .dl 的那个文件 ③ 长按它，选「重命名」④ 把结尾的 .dl 删掉（让它以原来的格式结尾）⑤ 改完点开就能看了。");
      arm();
    } catch { note("保存没成功，再点一次试试。"); }
  };
  sc.onclick = async () => {
    if(st.mf) await mfWipe(st.mf); else { try { await writer.discard(); } catch {} }
    if(fcCurrent === st) fcCurrent = null;
    for(const id of ["fc-clean", "fc-save", "fc-save-alt"]) FC(id).classList.add("hidden");
    note("临时文件已清理干净。");
  };
}

/* —— 下载主流程（fresh / resume 共用） —— */
async function runDownload(f, fileId, resumeMf){ return runDlMain(f, fileId, resumeMf, null); }
async function runDlMain(f, fileId, resumeMf, banned){
  showCard(f);
  FC("fc-cancel").classList.remove("hidden");
  note(resumeMf ? "接着上次的进度往下下——保持这个页面打开，下完点保存。" : (banned && banned.size ? "刚才那个下载通道中途出问题了，已经自动换了一个通道重新下，不用你管——保持页面打开，下完点保存。" : "正在找最快的下载通道，稍等一下…"));
  const size = f.size;
  const nSeg = Math.ceil(size / SEG_SIZE);
  const st = { f, writer: null, mf: resumeMf || null, done: false, cancelled: false, file: null, doneSet: new Set(), doneBytes: 0, runBytes: 0, timer: null, aborts: new Set() };
  fcCurrent = st;
  wlOn();
  window.addEventListener("beforeunload", leaveGuard);
  let probeDone = false;
  const slowTimer = setTimeout(() => {
    if(probeDone || st.done) return;
    note("还在找通道…这个浏览器反应有点慢，网络好的话再等一小会儿就行；不想等也可以点下面按钮先用普通下载。");
    const fb = FC("fc-fallback");
    fb.textContent = "用普通下载这个文件";
    fb.classList.remove("hidden");
    fb.onclick = () => { location.href = f.url; };
  }, 8000);
  const segLen = i => Math.min(SEG_SIZE, size - i * SEG_SIZE);
  const finishUi = () => {
    probeDone = true;
    clearTimeout(slowTimer);
    clearInterval(st.timer);
    wlOff();
    window.removeEventListener("beforeunload", leaveGuard);
    FC("fc-cancel").classList.add("hidden");
    FC("fc-fallback").classList.add("hidden");
  };
  FC("fc-cancel").onclick = () => {
    st.cancelled = true;
    /* 正在卡住的那一步也要立刻断，不然取消只是个摆设（百度实测） */
    if(st.aborts) for(const c of st.aborts){ try { c.abort(); } catch {} }
    try { if(st.writer && st.writer.kill) st.writer.kill(new Error("已取消")); } catch {}
  };
  try {
    /* 通道打开：续传强制原通道；全新依次 OPFS → IDB → 内存 */
    let writer = null, mf = resumeMf || null;
    if(mf){
      try {
        if(mf.channel === "opfs"){ writer = new FcOpfsWriter(mf.fname); await writer.open(true); }
        else { writer = new FcIdbWriter(); await writer.open(true); }
      } catch { try { if(writer) await writer.close(); } catch {} writer = null; }
      if(!writer){
        await mfWipe(mf);
        mf = null;
        note("上次存的临时数据找不回来了，这次重新下——正在找通道…");
      }
    }
    if(!writer){
      /* 配额先读一次：OPFS/IDB 共用同一块存储池，配额装不下整文件时 OPFS 是死路
       * （百度只给 15MB，小工会在配额墙上静默卡死）——不够就别选，省得撞墙再降级 */
      let quota = 0;
      try { const est = await navigator.storage.estimate(); quota = est.quota || 0; } catch {}
      const quotaTooSmall = quota > 0 && quota < size * 1.2;
      /* 按给定黑名单选一条通道：IDB → OPFS → 内存，选到返回 true
       * （2026-10-21 翻序，CAI 拍板：两通道写盘都比兄弟们的网速快一个数量级，拼的是开通道速度与故障面——
       *  IDB 页内直开、无 Worker 环节，且是 QQ 实测过的通道；OPFS 退居二线垫后） */
      const trySelect = async (banSet) => {
        if(!banSet.has("IndexedDB 中转") && window.indexedDB && quota > size * 1.2){
          try {
            const w = new FcIdbWriter();
            await w.open(false);
            writer = w;
            mf = { v: 1, key: fileKeyOf(fileId), name: f.name, size, mime: f.mime, url: f.url, channel: "idb", seg: SEG_SIZE, nSeg, done: [], complete: false, ts: Date.now() };
          } catch {}
        }
        if(!writer && !banSet.has("OPFS 直写盘") && !quotaTooSmall && navigator.storage && navigator.storage.getDirectory){
          const fname = fnameOf(fileKeyOf(fileId));
          const w = new FcOpfsWriter(fname);
          try {
            await w.open(false);
            writer = w;
            mf = { v: 1, key: fileKeyOf(fileId), name: f.name, size, mime: f.mime, url: f.url, channel: "opfs", fname, seg: SEG_SIZE, nSeg, done: [], complete: false, ts: Date.now() };
          } catch { try { await w.close(); } catch {} }
        }
        if(!writer && !banSet.has("内存拼装")){
          const dm = navigator.deviceMemory || 2;
          const cap = dm >= 8 ? 768 * 1048576 : 256 * 1048576;
          if(size <= cap){ writer = new FcMemWriter(); await writer.open(); mf = null; }
        }
        if(writer && mf) mfSave(mf);
        return !!writer;
      };
      /* 本轮黑名单 = 链内降级传下来的 + 本浏览器 3 天拉黑记忆（三条通道同规；这个块只在没续传通道可用时才跑，合并正好；
         续传本身走原通道不看拉黑——数据存在那儿，打开失败会自己落到这里重新选） */
      const banEff = new Set(banned || []);
      for(const k of chanBanLoad()) banEff.add(k);
      await trySelect(banEff);
      /* 没选到就没选到：兜底是普通下载（failNote 的按钮），一直都是——不搞无视拉黑硬试那套 */
    }
    if(!writer){
      finishUi();
      fcCurrent = null;
      failNote(f, null, fileId);
      return;
    }
    st.writer = writer;
    st.mf = mf;
    /* 续传对账：IDB 以实际钥匙为准；OPFS 信账本 */
    if(mf && resumeMf){
      if(mf.channel === "idb"){
        const keys = await writer.presentKeys();
        st.doneSet = new Set(keys.filter(k => Number.isInteger(k) && k >= 0 && k < nSeg));
      } else {
        st.doneSet = new Set((mf.done || []).filter(i => i >= 0 && i < nSeg));
      }
      for(const i of st.doneSet) st.doneBytes += segLen(i);
      mf.done = [...st.doneSet];
      mf.ts = Date.now();
      mfSave(mf);
    }
    probeDone = true;
    clearTimeout(slowTimer);
    FC("fc-fallback").classList.add("hidden");
    note("通道找好了（" + writer.kind + "），正在下载——保持这个页面打开，下完点保存。");
    /* 进度刷新（速度按本次新下的量算，续传的老量不冒充速度） */
    const t0 = Date.now();
    let samples = [];
    st.timer = setInterval(() => {
      const el = (Date.now() - t0) / 1000;
      const nowB = st.doneBytes, runB = st.runBytes;
      samples.push([performance.now(), runB]);
      while(samples.length > 2 && performance.now() - samples[0][0] > 2000) samples.shift();
      let cur = 0;
      if(samples.length >= 2){ const [pt, pb] = samples[0]; const dt = (performance.now() - pt) / 1000; if(dt > 0.2) cur = (runB - pb) / dt; }
      const avg = el > 0 ? runB / el : 0;
      FC("fc-fill").style.width = (nowB / size * 100).toFixed(1) + "%";
      FC("fc-pct").textContent = (nowB / size * 100).toFixed(1) + "%";
      FC("fc-got").textContent = fmtSize(nowB);
      FC("fc-cur").textContent = fmtSpeed(cur);
      FC("fc-avg").textContent = fmtSpeed(avg);
      let timeTxt = el.toFixed(0) + "s";
      if(avg > 0 && nowB > 0 && nowB < size) timeTxt += "（约剩 " + fmtDur((size - nowB) / avg) + "）";
      FC("fc-time").textContent = timeTxt;
      FC("fc-seg").textContent = st.doneSet.size + "/" + nSeg;
    }, 250);
    /* 拉一段的字节：看进度判死——字节还在动就让它下（多慢都行），连续 20 秒纹丝不动才掐，600 秒兜底防僵尸；
       网络侧的错一律打 net 标，跟通道错分开——网络的锅不让通道背（CAI 2026-10-21 定：只有通道真死才降级拉黑） */
    const fetchBuf = async (start, end) => {
      const ctl = new AbortController();
      st.aborts.add(ctl);
      let lastTick = Date.now();
      const dog = setInterval(() => { if(Date.now() - lastTick > 20000){ try { ctl.abort(); } catch {} } }, 2000);
      const hard = setTimeout(() => { try { ctl.abort(); } catch {} }, 600000);
      try {
        const r = await fetch(f.url, { headers: { Range: "bytes=" + start + "-" + end }, signal: ctl.signal });
        if(r.status !== 206) throw new Error("HTTP " + r.status);
        if(r.body && r.body.getReader){
          const reader = r.body.getReader();
          const parts = [];
          let got = 0;
          for(;;){
            const rd = await reader.read();
            if(rd.done) break;
            if(rd.value && rd.value.byteLength){ parts.push(rd.value); got += rd.value.byteLength; lastTick = Date.now(); }
          }
          const buf = new Uint8Array(got);
          let off = 0;
          for(const p of parts){ buf.set(p, off); off += p.byteLength; }
          return buf.buffer;
        }
        /* 没有流式 body 的老浏览器：看不见进度就不启用停滞判死，只留 600 秒兜底 */
        clearInterval(dog);
        return await r.arrayBuffer();
      } catch (e) {
        const ne = e instanceof Error ? e : new Error(String(e));
        ne.net = true;
        throw ne;
      } finally {
        clearInterval(dog); clearTimeout(hard); st.aborts.delete(ctl);
      }
    };
    /* 分段拉取：网络错在段内重试 3 次，耗尽算整轮网络失败（停成暂停、不降级）；
       写手出错是通道自己的命，不重试、直接抛上去由整轮判降级 */
    const fetchSeg = async i => {
      const start = i * SEG_SIZE, end = Math.min(size, start + SEG_SIZE) - 1;
      let lastErr = null;
      for(let a = 0; a < 3; a++){
        if(st.cancelled) throw lastErr || new Error("已取消");
        /* 通道已判死就别再白拉一段：立刻抛错走降级（看门狗判死后写手自带 _deadErr） */
        if(writer._deadErr) throw writer._deadErr;
        let buf;
        try { buf = await fetchBuf(start, end); }
        catch (e){ lastErr = e; if(st.cancelled) throw e; await new Promise(r => setTimeout(r, 600)); continue; }
        if(buf.byteLength !== end - start + 1){
          lastErr = new Error("长度不对"); lastErr.net = true;
          if(st.cancelled) throw lastErr;
          await new Promise(r => setTimeout(r, 600)); continue;
        }
        await writer.writeAt(start, buf);
        return;
      }
      throw lastErr || new Error("分段失败");
    };
    const todoIdx = [];
    for(let i = 0; i < nSeg; i++) if(!st.doneSet.has(i)) todoIdx.push(i);
    let cursor = 0, fatal = null;
    const lane = async () => {
      while(cursor < todoIdx.length && !st.cancelled){
        const i = todoIdx[cursor++];
        try {
          await fetchSeg(i);
          st.doneSet.add(i);
          st.doneBytes += segLen(i);
          st.runBytes += segLen(i);
          if(st.mf){ st.mf.done = [...st.doneSet]; st.mf.ts = Date.now(); mfSave(st.mf); }
        } catch (e){ if(!fatal) fatal = e; return; }
      }
    };
    await Promise.all(Array.from({ length: Math.min(CONC, Math.max(todoIdx.length, 1)) }, lane));
    if(st.cancelled){
      finishUi();
      try { await writer.close(); } catch {}
      if(fcCurrent === st) fcCurrent = null;
      if(st.mf){
        note("已暂停——点「继续下载」就能从这里接着下（下好的部分只留 1 小时）。不想要了，点「清理临时文件」。" );
        const go = FC("fc-go");
        go.textContent = "继续下载";
        go.classList.remove("hidden");
        go.onclick = () => { go.classList.add("hidden"); runDownload(f, fileId, st.mf); };
        const sc = FC("fc-clean");
        sc.classList.remove("hidden");
        sc.onclick = async () => { await mfWipe(st.mf); sc.classList.add("hidden"); go.classList.add("hidden"); note("临时文件已清理干净。"); };
      } else {
        note("已取消。");
      }
      return;
    }
    if(fatal) throw fatal;
    await writer.finish();
    const fileObj = await Promise.race([writer.getFile(f.name, f.mime), new Promise((_, rej) => setTimeout(() => rej(new Error("拼装文件超时")), 20000))]);
    if(fileObj.size !== size) throw new Error("拼出来的文件大小对不上");
    st.file = fileObj;
    st.done = true;
    if(st.mf){ st.mf.complete = true; st.mf.ts = Date.now(); mfSave(st.mf); }
    finishUi();
    FC("fc-fill").style.width = "100%";
    FC("fc-pct").textContent = "100%";
    FC("fc-got").textContent = fmtSize(size);
    FC("fc-seg").textContent = nSeg + "/" + nSeg;
    presentSave(st);
    note("✅ 下载完成！点蓝色的「保存文件」就能存到手机。注意：要是点了保存、下载却卡住不动（有些浏览器会这样），就改点橙色的「备用保存」——它存下来的文件要改个名才能看，点完备用保存我会一步步教你改，很简单。");
  } catch (err) {
    finishUi();
    try { if(st.writer) await st.writer.close(); } catch {}
    if(fcCurrent === st) fcCurrent = null;
    /* 降级只配给通道真死：网络错（带 net 标）停成暂停——账本和下好的段原样留着，网络好了点「继续下载」原地续；
       通道错（写手判死/写入/拼装出错）且还有更低一级 → 擦掉残货换下一级自动重下；坏到内存拼装才找用户 */
    const tiers = ["IndexedDB 中转", "OPFS 直写盘", "内存拼装"];
    const curKind = st.writer ? st.writer.kind : null;
    const tIdx = curKind ? tiers.indexOf(curKind) : -1;
    /* 内存是最后一站、没有下一级可降，它真死时同样盖章记 3 天（三条通道同规） */
    if(!st.cancelled && !(err && err.net) && curKind === "内存拼装") chanBanStamp(curKind);
    if(!st.cancelled && !(err && err.net) && tIdx >= 0 && tIdx < tiers.length - 1){
      const nb = new Set(banned || []);
      nb.add(curKind);
      chanBanStamp(curKind); /* 真死一次记 3 天：这个浏览器下次选通道直接跳过它 */
      if(st.mf){ try { await mfWipe(st.mf); } catch {} }
      return runDlMain(f, fileId, null, nb);
    }
    failNote(f, st.mf, fileId, !!(err && err.net));
  }
}

/* —— 认领：下完忘存的，回来直接保存 —— */
async function claimDone(mf, f){
  showCard(f);
  note("正在把你下好的文件找回来…");
  let writer = null;
  try {
    if(mf.channel === "opfs") writer = new FcOpfsWriter(mf.fname);
    else { writer = new FcIdbWriter(); await writer.open(true); }
    const file = await writer.getFile(f.name, f.mime);
    if(file.size !== mf.size) throw new Error("大小对不上");
    const st = { f, writer, mf, file, done: true };
    fcCurrent = st;
    FC("fc-fill").style.width = "100%";
    FC("fc-pct").textContent = "100%";
    FC("fc-got").textContent = fmtSize(f.size);
    FC("fc-seg").textContent = mf.nSeg + "/" + mf.nSeg;
    presentSave(st);
    note("这个文件你之前已经下完啦，还没存到手机——直接点「保存文件」就行，不用重新下。");
  } catch {
    try { if(writer) await writer.discard(); } catch {}
    mfSave(null);
    note("之前下好的那份找不回来了，点⚡可以重新下。");
  }
}

/* —— ⚡ 入口：先对账，再决定开哪道门 —— */
async function startFast(f, fileId){
  if(fcCurrent){
    if(!fcCurrent.done){ note("上面那个文件还在下，先等它下完，或者点「取消」。"); FC("fast-card").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    const prev = fcCurrent;
    fcCurrent = null;
    try { if(prev.mf) await mfWipe(prev.mf); else if(prev.writer) await prev.writer.discard(); } catch {}
  }
  let mf = mfLoad();
  const key = fileKeyOf(fileId);
  if(mf && mf.key !== key){ await mfWipe(mf); mf = null; }
  if(mf && (Date.now() - mf.ts > ACCEL_TTL || mf.size !== f.size)){ await mfWipe(mf); mf = null; }
  if(mf && mf.complete){ await claimDone(mf, f); return; }
  showCard(f);
  const go = FC("fc-go"), no = FC("fc-no");
  go.classList.remove("hidden");
  no.classList.remove("hidden");
  const hideGate = () => { go.classList.add("hidden"); no.classList.add("hidden"); };
  if(mf){
    const pct = Math.floor(mf.done.length / mf.nSeg * 100);
    note("这个文件上次下到 " + pct + "% 就停了（下好的部分只留 1 小时）。接着下能省不少流量，点「开始加速」就是接着下；想从头下点下面那个按钮。");
    go.onclick = () => { hideGate(); runDownload(f, fileId, mf); };
    no.onclick = () => { FC("fast-card").classList.add("hidden"); };
    const fb = FC("fc-fallback");
    fb.textContent = "不用上次的，从头重新下";
    fb.classList.remove("hidden");
    fb.onclick = async () => { await mfWipe(mf); hideGate(); fb.classList.add("hidden"); runDownload(f, fileId, null); };
    return;
  }
  note("先想一下再点：加速要把整个文件先下到浏览器里（大小 " + fmtSize(f.size) + "），下完再由你点「保存」存进手机。所以开始后别关这个页面、也别切到别的 App，几百 MB 的大文件最好连 WiFi 下。");
  go.onclick = () => { hideGate(); runDownload(f, fileId, null); };
  no.onclick = () => { FC("fast-card").classList.add("hidden"); };
}
boot();
</script>
