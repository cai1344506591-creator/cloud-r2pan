<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cloud-r2pan</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
  padding: 24px 24px 84px; color: #fff; position: relative;
  background: linear-gradient(160deg, #0b1026 0%, #1a1240 45%, #2a1045 100%);
  -webkit-tap-highlight-color: transparent;
}
.orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5; pointer-events: none; animation: drift 18s ease-in-out infinite alternate; }
.o1 { width: 46vmax; height: 46vmax; background: #38bdf8; top: -18%; left: -14%; }
.o2 { width: 40vmax; height: 40vmax; background: #8b5cf6; bottom: -20%; right: -10%; animation-delay: -6s; }
.o3 { width: 30vmax; height: 30vmax; background: #ec4899; top: 55%; left: 8%; animation-delay: -12s; opacity: .35; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vw, -5vh) scale(1.12); } }

.card {
  position: relative; width: 100%; max-width: 440px; margin: auto 0; flex: none;
  padding: 48px 36px 40px; border-radius: 36px; text-align: center;
  background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
  backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid rgba(255,255,255,.28);
  box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
  animation: rise .65s cubic-bezier(.22,1.2,.36,1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.95); } to { opacity: 1; transform: none; } }

.file-icon {
  width: 104px; height: 104px; margin: 0 auto 24px; border-radius: 30px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.08));
  border: 1px solid rgba(255,255,255,.32);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 14px 34px rgba(0,0,0,.35);
  position: relative; overflow: hidden;
}
.file-icon::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 48%, transparent 62%);
  transform: translateX(-120%); animation: shine 4.5s ease-in-out infinite;
}
@keyframes shine { 0%, 60% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
.file-icon .ext { font-size: 26px; font-weight: 800; letter-spacing: -.02em; text-shadow: 0 2px 8px rgba(0,0,0,.25); }

/* 批量分享：头部压缩（图标缩小、标题单行），让文件列表优先露出 */
.card.batch .file-icon { width: 68px; height: 68px; margin-bottom: 14px; border-radius: 20px; }
.card.batch .file-icon .ext { font-size: 17px; }
.card.batch h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 小屏：卡片收紧，给内容腾地方 */
@media (max-width: 480px){
  body { padding: 14px 14px 84px; }
  .card { padding: 30px 20px 26px; border-radius: 28px; }
}

h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; word-break: break-all; line-height: 1.35; }
.meta { margin-top: 10px; font-size: 14px; color: rgba(255,255,255,.72); display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
.meta .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.4); }

.stats { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
.stat {
  flex: 0 1 150px; padding: 6px 4px; border-radius: 12px;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
}
.stat .v { font-size: 13.5px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .k { margin-top: 1px; font-size: 10px; color: rgba(255,255,255,.6); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; margin-top: 28px; padding: 17px; border: none; border-radius: 22px;
  font-size: 17px; font-weight: 650; letter-spacing: -.01em; color: #fff; cursor: pointer;
  background: linear-gradient(180deg, #3d9bff, #0a7cff);
  box-shadow: 0 12px 30px rgba(10,124,255,.42), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .15s cubic-bezier(.22,1.2,.36,1), box-shadow .2s;
  text-decoration: none; -webkit-user-select: none; user-select: none;
}
.btn:hover { transform: translateY(-1px) scale(1.01); }
.btn:active { transform: scale(.97); }
.btn svg { width: 19px; height: 19px; }

.hint { margin-top: 14px; font-size: 12.5px; color: rgba(255,255,255,.55); line-height: 1.6; }

.warn { margin-top: 18px; padding: 13px 16px; border-radius: 16px; font-size: 13.5px; line-height: 1.55;
  background: rgba(255,159,10,.14); border: 1px solid rgba(255,159,10,.35); color: #ffd9a0; }

.loading { padding: 80px 0; text-align: center; }
.spinner { width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.18); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.brand { position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
  font-size: 13px; color: rgba(255,255,255,.4); letter-spacing: .08em; }
.brand b { font-weight: 650; }
.lang-btn { margin-left: 10px; padding: 4px 13px; border-radius: 11px; border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.75); font-size: 12px; font-family: inherit;
  letter-spacing: 0; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: all .2s; vertical-align: 1px; }
.lang-btn:hover { background: rgba(255,255,255,.2); color: #fff; }

/* GitHub Octocat 悬浮按钮 */
.octo-float {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(20px, env(safe-area-inset-bottom));
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.05));
  border: 1px solid rgba(255,255,255,.28);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; text-decoration: none; z-index: 50;
  box-shadow: 0 8px 22px rgba(0,0,0,.35);
  transition: transform .25s cubic-bezier(.22,1.2,.36,1), box-shadow .25s;
}
.octo-float:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.octo-float svg { width: 22px; height: 22px; color: #fff; }

.pw { margin-top: 6px; }
.pw input {
  width: 100%; margin-top: 22px; padding: 16px; border-radius: 16px; text-align: center;
  font-size: 17px; font-family: inherit; color: #fff; outline: none;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.28);
}
.pw input::placeholder { color: rgba(255,255,255,.45); }
.pw input:focus { border-color: #3d9bff; }
.pw .err { margin-top: 10px; font-size: 13px; color: #ff8480; min-height: 18px; }
.pw .pw-hint { margin-top: 12px; font-size: 12.5px; color: rgba(255,255,255,.55); }
.pw.shake input { animation: shake .5s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }

/* Turnstile */
.ts-wrap {
  width: 100%; margin-top: 22px; display: flex; justify-content: center;
}
.ts-wrap div, .ts-wrap iframe { border-radius: 14px !important; }
.ts-passed {
  width: 100%; margin-top: 22px; padding: 14px; border-radius: 16px;
  background: rgba(110,231,183,.15); border: 1px solid rgba(110,231,183,.4);
  color: #6ee7b7; font-size: 14px; text-align: center; font-weight: 600;
}
.ts-blocked-title { margin-top: 22px; font-size: 14px; color: #fde68a; font-weight: 600; }
.ts-blocked-hint { margin-top: 6px; font-size: 12.5px; color: rgba(255,255,255,.6); line-height: 1.6; }

/* ═══════ 激活码浮动按钮 ═══════ */
.code-float {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  left: max(16px, env(safe-area-inset-left));
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(10,132,255,.25), rgba(10,132,255,.1));
  border: 1px solid rgba(10,132,255,.45);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 50;
  box-shadow: 0 8px 22px rgba(10,132,255,.25);
  transition: transform .25s cubic-bezier(.22,1.2,.36,1), box-shadow .25s;
}
.code-float.position-right {
  left: auto;
  right: max(16px, env(safe-area-inset-right));
}
.code-float:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 12px 30px rgba(10,132,255,.35); }
.code-float svg { width: 22px; height: 22px; color: #a5d8ff; }
.code-float .badge {
  position: absolute; top: -2px; right: -2px; width: 12px; height: 12px;
  border-radius: 50%; background: #34d399; border: 2px solid #0b1026;
}

/* ═══════ 激活码弹窗 ═══════ */
.code-modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.code-modal {
  width: min(400px, 92vw); padding: 26px 24px 22px; border-radius: 28px;
  background: linear-gradient(160deg, rgba(30,28,60,.95), rgba(15,13,38,.96));
  backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(255,255,255,.2);
  box-shadow: 0 -20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
  animation: sheetUp .35s cubic-bezier(.22,1.1,.36,1) both;
}
@keyframes sheetUp { from { transform: translateY(40px) scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }
.code-modal h3 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.code-modal .sub { font-size: 12.5px; color: rgba(255,255,255,.5); margin-top: 4px; }
.code-modal .close {
  position: absolute; top: 14px; right: 14px; width: 30px; height: 30px;
  border-radius: 50%; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.6); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.code-modal .close:hover { background: rgba(255,255,255,.15); color: #fff; }
.code-bound-row {
  margin-top: 16px; padding: 14px 16px; border-radius: 16px;
  background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.35);
}
.code-bound-row .label { font-size: 11px; color: rgba(110,231,183,.8); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.code-bound-row .code { font-family: ui-monospace,'SF Mono',monospace; font-size: 14px; color: #6ee7b7; margin-top: 4px; letter-spacing: .03em; }
.code-bound-row .detail { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
.code-bound-row .unbind-btn {
  padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06); color: rgba(255,255,255,.7); font-size: 12px;
  cursor: pointer; transition: all .15s;
}
.code-bound-row .unbind-btn:hover { background: rgba(255,69,58,.15); border-color: rgba(255,69,58,.4); color: #ffb3ae; }
.code-input-row {
  margin-top: 18px; display: flex; flex-direction: column; gap: 10px;
}
.code-input-row input {
  width: 100%; padding: 13px 16px; border-radius: 14px; font-size: 14px;
  font-family: ui-monospace,'SF Mono',monospace; color: #fff; outline: none;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
  letter-spacing: .04em; text-align: center;
}
.code-input-row input:focus { border-color: #3d9bff; background: rgba(255,255,255,.12); }
.code-input-row input::placeholder { color: rgba(255,255,255,.35); }
.code-btn-row { display: flex; gap: 10px; }
.code-btn-row button {
  flex: 1; padding: 12px 14px; border-radius: 13px; border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08); color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s; font-family: inherit;
}
.code-btn-row button:hover { background: rgba(255,255,255,.15); }
.code-btn-row button.primary {
  background: linear-gradient(180deg,#3d9bff,#0a7cff); border-color: transparent;
  box-shadow: 0 6px 16px rgba(10,124,255,.3);
}
.code-btn-row button.primary:hover { filter: brightness(1.06); }
.code-query-result {
  margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 13px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.8); min-height: 20px;
}
.code-query-result.ok { background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.35); color: #6ee7b7; }
.code-query-result.warn { background: rgba(255,159,10,.12); border-color: rgba(255,159,10,.35); color: #fcd34d; }
.code-query-result.err { background: rgba(255,69,58,.12); border-color: rgba(255,69,58,.35); color: #fda293; }
.code-progress { margin-top: 8px; height: 3px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
.code-progress i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg,#34d399,#60a5fa); }

/* ═══════ ⚡ 加速下载（页内分段引擎，从实验室定版搬入） ═══════ */
.hidden { display: none !important; }
.fast-btn { padding: 6px 10px; border-radius: 8px; border: none; cursor: pointer; white-space: nowrap;
  background: linear-gradient(180deg,#f7bd45,#f08c0a); color: #231500; font-weight: 700; font-size: 12.5px; font-family: inherit;
  box-shadow: 0 6px 16px rgba(240,140,10,.4), inset 0 1px 0 rgba(255,255,255,.45); }
.fast-btn:active { transform: scale(.96); }
.btn.fast { background: linear-gradient(180deg,#f7bd45,#f08c0a); color: #231500;
  box-shadow: 0 12px 30px rgba(240,140,10,.35), inset 0 1px 0 rgba(255,255,255,.5); }
.btn.fast.small { width: 72%; margin: 12px auto 0; padding: 11px; font-size: 14.5px; border-radius: 16px; }
.fast-card { width: 100%; margin-top: 22px; padding: 18px; border-radius: 20px; text-align: left;
  background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.05));
  border: 1px solid rgba(255,255,255,.22);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.fast-card .fc-name { font-size: 15px; font-weight: 650; word-break: break-all; }
.fast-card .fc-badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; margin-left: 8px; vertical-align: 2px;
  background: rgba(52,211,153,.18); color: #6ee7b7; border: 1px solid rgba(52,211,153,.4); }
.fast-card .fc-bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin: 12px 0; }
.fast-card .fc-bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg,#38bdf8,#818cf8); transition: width .2s; }
.fast-card .fc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; color: rgba(255,255,255,.85); font-variant-numeric: tabular-nums; }
.fast-card .fc-btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.fast-card .fc-btns button { flex: 1; min-width: 110px; padding: 12px; border-radius: 14px; cursor: pointer; font-family: inherit;
  border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; font-size: 14px; font-weight: 600; }
.fast-card .fc-btns button.primary { background: linear-gradient(180deg,#3d9bff,#0a7cff); border-color: transparent; }
.fast-card .fc-btns button.alt { background: linear-gradient(180deg,#f7bd45,#f08c0a); color: #231500; border-color: transparent; }
.fast-card .fc-btns button.danger { background: rgba(255,69,58,.18); border-color: rgba(255,69,58,.4); }
.fast-card .fc-note { margin-top: 10px; font-size: 12.5px; color: #ffd9a0; line-height: 1.6; }
</style>
</head>

<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="card" id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div style="font-size:14px;color:rgba(255,255,255,.65)" id="loading-text"></div>
  </div>
</div>

<div class="brand"><span id="brand-text">Powered by <b>cloud-r2pan</b></span><button class="lang-btn" id="lang-toggle"></button></div>

<!-- GitHub Octocat 悬浮（仅图标装饰，2026-10-20 CAI 指示去掉外链） -->
<span class="octo-float" aria-hidden="true">
  <!-- Octocat silhouette — GitHub 官方吉祥物 -->

<script>
/* ═══════════ i18n ═══════════ */
const I18N = {
  zh: {

    switchTo: 'EN',
    // Turnstile
    turnstileBlocked: '🛡️ 需要完成人机验证',
    turnstileHint: '该链接被管理员设为需要验证，请完成下方的人机检查后继续下载',

    turnstilePass: '验证通过 ✓',

    turnstileDownloadNow: '立即下载',
    // OAuth2
    oauthLogin: '使用 {provider} 登录',
    oauthLoggedInAs: '已登录 {provider}',
    oauthLogout: '退出',

/** 语言检测：手动选择 > 浏览器首选语言 > 时区（大中华区） > 英文 */
function detectLang(){
  try {
    const saved = localStorage.getItem('cd_lang');
    if (saved === 'zh' || saved === 'en') return saved;
  } catch {}
  const first = String((navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language) || '').toLowerCase();
  if (first.startsWith('zh')) return 'zh';
  if (first) return 'en';
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (/^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar|Hong_Kong|Macau|Taipei)$/.test(tz)) return 'zh';
  } catch {}
  return 'en';
}

let LANG = detectLang();
const t = (key, params) => {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  return s;
};

document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
$('#loading-text').textContent = t('loading');
$('#lang-toggle').textContent = t('switchTo');
$('#lang-toggle').onclick = () => {
  try { localStorage.setItem('cd_lang', LANG === 'zh' ? 'en' : 'zh'); } catch {}
  location.reload();
};

const EXT_COLORS = {
  zip:'#ffb340', rar:'#ffb340', '7z':'#ffb340', tar:'#ffb340', gz:'#ffb340',
  pdf:'#ff6961', doc:'#5b9cf5', docx:'#5b9cf5', txt:'#9aa4b2', md:'#9aa4b2',
  xls:'#3ecf8e', xlsx:'#3ecf8e', csv:'#3ecf8e', ppt:'#ff9f0a', pptx:'#ff9f0a',
  mp3:'#bf5af2', wav:'#bf5af2', flac:'#bf5af2', m4a:'#bf5af2',
  mp4:'#ff453a', mov:'#ff453a', mkv:'#ff453a', avi:'#ff453a',
  png:'#30d158', jpg:'#30d158', jpeg:'#30d158', gif:'#30d158', webp:'#30d158', svg:'#30d158',
  apk:'#3ecf8e', exe:'#9aa4b2', iso:'#9aa4b2', dmg:'#9aa4b2', default:'#8ea0c8'
};
function extOf(name){ const m=/\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():''; }
function extColor(name){ return EXT_COLORS[extOf(name)]||EXT_COLORS.default; }
function fmtSize(n){
  if(!Number.isFinite(n))return '—';
  if(n<1024)return n+' B';
  const u=['KB','MB','GB','TB'];let i=-1;
  do{n/=1024;i++;}while(n>=1024&&i<u.length-1);
  return n.toFixed(n>=100?0:n>=10?1:2)+' '+u[i];
}
function fmtTime(ts){
  const d=new Date(ts),p=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function getBoundCode(){ try { return localStorage.getItem('r2pan_code')?.trim().toUpperCase() || null; } catch { return null; } }
function setBoundCode(c){ try { if(c) localStorage.setItem('r2pan_code', c.trim().toUpperCase()); else localStorage.removeItem('r2pan_code'); } catch {} }

const token = location.pathname.split('/')[2];

let TURSTILE_LOADED = false, turnstileReady = false, pendingCb = null;
function loadTurnstileScript(onload){
  if(TURSTILE_LOADED){ if(window.turnstile){ window.turnstile.ready(cb=>{ turnstileReady = true; onload&&onload(cb); }); } return; }
  TURSTILE_LOADED = true;
  window.onTurnstileLoad = () => { turnstileReady = true; onload && onload(window.turnstile); };
  const s = document.createElement('script');
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad';
  s.async = true; s.defer = true;
  document.head.appendChild(s);
}

/**
 * 渲染 Turnstile widget 并等待完成。
 * 返回 Promise<string> —— token 字符串。
 */
async function renderTurnstile(containerEl, sitekey){
  containerEl.innerHTML = '<div class="ts-wrap"><div class="ts-box" data-sitekey="'+sitekey+'"></div></div>';
  loadTurnstileScript();
  // 等待 window.turnstile 出现
  await new Promise(resolve => {
    const check = () => { if(window.turnstile){ resolve(); } else { setTimeout(check, 80); } };
    check();
  });
  return await new Promise((resolve, reject) => {
    const id = window.turnstile.render(containerEl.querySelector('.ts-box'), {
      sitekey,
      theme: 'auto',
      callback: (tk) => resolve(tk),
      'error-callback': () => reject(new Error('ts_error')),
      'timeout-callback': () => reject(new Error('ts_timeout')),
    });
    containerEl.dataset.tsWidgetId = id;
  });
}

async function boot(){
  // OAuth callback 返回的错误参数 → 页面顶部提示
  const params = new URLSearchParams(location.search);
  const oauthErr = params.get('oauth_error');

  let info;
  let oauthProviders = [];
  try{
    const r = await fetch(`/s/${token}/info`, {cache:'no-store'});
    if(!r.ok) throw 0;
    info = await r.json();
  }catch{ renderError(t('notFoundTitle'), t('notFoundMsg')); return; }
  // 如果 OAuth2 启用了，拉启用中的 Provider 列表来渲染多个按钮
  if (info.oauth?.enabled) {
    try {
      const r2 = await fetch('/oauth/providers', {cache:'no-store'});
      if (r2.ok) {
        const j = await r2.json();
        oauthProviders = j.providers || [];
      }
    } catch {}
  }
  const siteName = info.site_title || 'cloud-r2pan';
  document.title = t('pageTitle', {site: siteName});
  $('#brand-text').innerHTML = `Powered by <b>${esc(siteName)}</b>`;
  render(info, siteName, oauthErr, oauthProviders);
}

function renderError(title,msg){
  $('#app').innerHTML = `

}

async function triggerDownload(d, ts, tsEnabled, tsOnDownload){
  const baseUrl = `/s/${token}/download`;
  // 读取已绑定的激活码（从 localStorage）
  const code = getBoundCode();
  // both / on_download 模式：先确保有 token
  if(tsEnabled && tsOnDownload){
    let tk = window.__tsToken;
    if(!tk){
      // 还没渲染过 → 现在渲染
      const box = document.createElement('div');
      box.style.cssText = 'margin-top:20px';
      document.body.appendChild(box);
      try{
        tk = await renderTurnstile(box, ts.sitekey);
        window.__tsToken = tk;
        box.remove();
      }catch{ box.remove(); return; }
    }
    let url = `${baseUrl}?cf=${tk}`;
    if(code) url += `&code=${encodeURIComponent(code)}`;
    location.href = url;
  } else {
    let url = baseUrl;
    if(code) url += `?code=${encodeURIComponent(code)}`;
    location.href = url;
  }
}

async function wireUnlock(d, ts, tsEnabled, tsOnDownload){
  const btn = $('#pw-go'), input = $('#pw'), err = $('#pw-err');
  const unlock = async () => {
    const pass = input.value;
    if(!pass) return;
    // 读取已绑定的激活码（从 localStorage）
    const code = getBoundCode();
    btn.style.pointerEvents = 'none'; btn.style.opacity = '.6';
    err.textContent = '';
    // both 模式：需要 Turnstile token
    let turnstileToken = null;
    if(tsEnabled && ts.mode === 'both'){
      let tk = window.__tsToken;
      if(!tk){
        const box = document.createElement('div');
        box.style.cssText = 'margin-top:14px';
        document.getElementById('pw-box').appendChild(box);
        try{
          tk = await renderTurnstile(box, ts.sitekey);
          window.__tsToken = tk;
          box.innerHTML = `<div class="ts-passed">${esc(t('turnstilePass'))}</div>`;
        }catch(e){ box.remove(); err.textContent = t('turnstileFail'); btn.style.pointerEvents = ''; btn.style.opacity = ''; return; }
      }
      turnstileToken = tk;
    }
    try{
      const body = { password: pass };
      if(turnstileToken) body.turnstile = turnstileToken;
      const r = await fetch(`/s/${token}/verify`, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
      let res = {};
      try{ res = await r.json(); }catch{}
      if(r.ok && res.url){
        // 批量分享：把解锁票据补到每个文件的下载按钮上，否则逐个下载会 403 需要密码
        try {
          const ticket = new URL(res.url, location.origin).searchParams.get('t');
          if(ticket){
            document.querySelectorAll('[data-dl-file]').forEach(a => {
              let u = `/s/${token}/download?file=${encodeURIComponent(a.getAttribute('data-dl-file'))}&t=${ticket}`;
              if(code) u += '&code=' + encodeURIComponent(code);
              a.setAttribute('href', u);
            });
          }
        } catch {}
        // on_download 模式需要 cf 参数
        if(tsEnabled && tsOnDownload && !res.url.includes('cf=')){
          let tk = window.__tsToken;
          if(!tk){
            const box = document.createElement('div');
            box.style.cssText = 'margin-top:14px';
            document.getElementById('pw-box').appendChild(box);
            tk = await renderTurnstile(box, ts.sitekey);
            window.__tsToken = tk;
            box.innerHTML = `<div class="ts-passed">${esc(t('turnstilePass'))}</div>`;
          }
          const sep = res.url.includes('?') ? '&' : '?';
          let dlUrl = res.url + sep + 'cf=' + tk;
          if(code){ const s2 = dlUrl.includes('?') ? '&' : '?'; dlUrl += s2 + 'code=' + encodeURIComponent(code); }
          location.href = dlUrl;
        } else {
          let dlUrl = res.url;
          if(code){ const s2 = dlUrl.includes('?') ? '&' : '?'; dlUrl += s2 + 'code=' + encodeURIComponent(code); }
          location.href = dlUrl;
        }
        return;
      }
      err.textContent = t(res.error === 'bad_password' ? 'wrongPassword' : 'wrongPassword');
      $('#pw-box').classList.remove('shake'); void $('#pw-box').offsetWidth; $('#pw-box').classList.add('shake');
      input.select();
    }catch{
      err.textContent = t('wrongPassword');
    }
    btn.style.pointerEvents = ''; btn.style.opacity = '';
  };
  btn.onclick = unlock;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
}

/* ═══════════ ⚡ 加速下载引擎（页内分段下载，实验室定版搬入） ═══════════
   通道顺序：OPFS 直写盘 → IndexedDB 中转 → 内存拼装（小文件）→ 都不行则提示改用普通下载。
   保存环节的两个坑（真机实测）：① OPFS 的 ArrayBuffer 用 transfer 过户后 byteLength 变 0，
   计数必须在 writeAt 之前取；② QQ 浏览器视频嗅探按 .mp4 后缀接管 blob 保存（卡 0B），
   故保存副本统一 octet-stream，并提供 .dl 备用保存（下完改名）。 */
function dlUrlFor(fileId){
  const parts = [];
  if(fileId) parts.push('file=' + encodeURIComponent(fileId));
  const code = getBoundCode();
  if(code) parts.push('code=' + encodeURIComponent(code));
  return `/s/${token}/download` + (parts.length ? '?' + parts.join('&') : '');
}
function guessMime(name){
  const e = extOf(name);
  return { mp4:'video/mp4', mov:'video/quicktime', mkv:'video/x-matroska', webm:'video/webm',
    mp3:'audio/mpeg', m4a:'audio/mp4', zip:'application/zip', rar:'application/vnd.rar',
    '7z':'application/x-7z-compressed', pdf:'application/pdf' }[e] || 'application/octet-stream';
}
const FC = s => document.getElementById(s);

/* —— IndexedDB 分段仓库（与实验室用不同库名，互不干扰） —— */
function idbOpen2(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open("r2pan-accel", 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore("chunks"); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function idbPut2(db, key, blob){
  return new Promise((res, rej) => {
    const tx = db.transaction("chunks", "readwrite");
    tx.objectStore("chunks").put(blob, key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error("idb abort"));
  });
}
function idbGetAll2(db, count){
  return new Promise((res, rej) => {
    const out = new Array(count);
    const tx = db.transaction("chunks", "readonly");
    const st = tx.objectStore("chunks");
    let done = 0;
    for(let i = 0; i < count; i++){
      const rq = st.get(i);
      rq.onsuccess = () => { out[i] = rq.result; if(++done === count) res(out); };
      rq.onerror = () => rej(rq.error);
    }
    if(count === 0) res(out);
  });
}
function idbClear2(db){
  return new Promise((res) => {
    try { const tx = db.transaction("chunks", "readwrite"); tx.objectStore("chunks").clear(); tx.oncomplete = res; tx.onerror = res; }
    catch { res(); }
  });
}

/* —— 三种写入通道 —— */
class FcOpfsWriter {
  constructor(){ this.kind = "OPFS 直写盘"; this.worker = null; this.seq = 0; this.pending = new Map(); }
  async open(size){
    this.worker = new Worker("/dlab-worker.js");
    this.worker.onmessage = (e) => {
      const m = e.data || {};
      const p = this.pending.get(m.id);
      if(!p) return;
      this.pending.delete(m.id);
      if(m.ok) p.res(m); else p.rej(new Error(m.error || "worker error"));
    };
    const fname = "accel-" + Date.now() + ".part";
    await this.call({ op: "open", name: fname, size });
    this.fname = fname;
  }
  call(msg){
    return new Promise((res, rej) => {
      const id = ++this.seq;
      this.pending.set(id, { res, rej });
      const to = setTimeout(() => { if(this.pending.has(id)){ this.pending.delete(id); rej(new Error("写入小工无响应（" + msg.op + "）")); } }, 20000);
      const wrap = { res: v => { clearTimeout(to); res(v); }, rej: e => { clearTimeout(to); rej(e); } };
      this.pending.set(id, wrap);
      try { this.worker.postMessage({ ...msg, id }, msg.buf ? [msg.buf] : []); }
      catch(err){ this.pending.delete(id); clearTimeout(to); rej(err); }
    });
  }
  async writeAt(pos, buf){ await this.call({ op: "write", pos, buf }); }
  async getFile(name, type){
    const r = await this.call({ op: "getfile" });
    const file = new File([r.blob], name, { type: type || r.blob.type || "application/octet-stream" });
    return file;
  }
  async cleanup(){ try { await this.call({ op: "remove" }); } catch {} try { this.worker && this.worker.terminate(); } catch {} }
}
class FcIdbWriter {
  constructor(){ this.kind = "IndexedDB 中转"; this.db = null; this.parts = 0; }
  async open(){ this.db = await idbOpen2(); await idbClear2(this.db); }
  async writeAt(pos, buf){ await idbPut2(this.db, this.parts++, new Blob([buf])); }
  async getFile(name, type){
    const parts = await idbGetAll2(this.db, this.parts);
    if(parts.some(p => !p)) throw new Error("分段缺失，拼装失败");
    return new File(parts, name, { type: type || "application/octet-stream" });
  }
  async cleanup(){ if(this.db){ await idbClear2(this.db); try { this.db.close(); } catch {} } }
}
class FcMemWriter {
  constructor(){ this.kind = "内存拼装"; this.map = new Map(); }
  async open(){}
  async writeAt(pos, buf){ this.map.set(pos, buf); }
  async getFile(name, type){
    const keys = [...this.map.keys()].sort((a, b) => a - b);
    return new File(keys.map(k => this.map.get(k)), name, { type: type || "application/octet-stream" });
  }
  async cleanup(){ this.map.clear(); }
}

let fcCurrent = null; // { cancelled, done, writer }
async function startFast(f){
  if(fcCurrent){
    if(!fcCurrent.done){
      const n0 = FC("fc-note"); n0.classList.remove("hidden");
      n0.textContent = "已有加速下载在进行，先取消它再换文件。";
      FC("fast-card").scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    // 上一个已下完：自动清理它的临时库存，直接开始新的
    try { await fcCurrent.writer.cleanup(); } catch {}
    fcCurrent = null;
  }
  const size = f.size || 0;
  const card = FC("fast-card");
  card.classList.remove("hidden");
  FC("fc-name").textContent = f.name;
  FC("fc-badge").classList.add("hidden");
  FC("fc-save").classList.add("hidden");
  FC("fc-save-alt").classList.add("hidden");
  FC("fc-clean").classList.add("hidden");
  FC("fc-cancel").classList.remove("hidden");
  FC("fc-note").classList.add("hidden");
  FC("fc-fill").style.width = "0%";
  FC("fc-pct").textContent = "0%";
  FC("fc-got").textContent = "—";
  FC("fc-cur").textContent = "—";
  FC("fc-avg").textContent = "—";
  FC("fc-time").textContent = "0s";
  FC("fc-seg").textContent = "—";
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  const note = (msg) => { const n = FC("fc-note"); n.classList.remove("hidden"); n.textContent = msg; };

  // 确认闸门：点⚡不直接开跑，先展开卡片把话说清（防误触、提醒别关页面、
  // 大文件先连 WiFi），用户点了「开始加速」才真正开始。
  const proceed = await new Promise(res => {
    FC("fc-cancel").classList.add("hidden");
    const goB = FC("fc-go"), noB = FC("fc-no");
    goB.classList.remove("hidden"); noB.classList.remove("hidden");
    note(`这个文件 ${fmtSize(size)}。加速会多开几条线一起下，快很多；但下载的时候别关这个页面、也别切到别的 App，不然会前功尽弃；下完再点保存存到手机。大文件建议先连 WiFi。确认就点「开始加速」。`);
    goB.onclick = () => { goB.classList.add("hidden"); noB.classList.add("hidden"); FC("fc-cancel").classList.remove("hidden"); res(true); };
    noB.onclick = () => { goB.classList.add("hidden"); noB.classList.add("hidden"); res(false); };
  });
  if(!proceed){ card.classList.add("hidden"); return; }
  note("正在找最快的下载通道，稍等一下——快的几秒，慢的要十几秒，耐心等，别关这个页面…");

  // 选通道
  let writer = null, lastErr = null;
  const opfsW = new FcOpfsWriter();
  try { await opfsW.open(size); writer = opfsW; } catch(e){ lastErr = e; try { opfsW.worker && opfsW.worker.terminate(); } catch {} }
  if(!writer && typeof indexedDB !== "undefined"){
    let quota = 0;
    try { const est = await navigator.storage.estimate(); quota = est.quota || 0; } catch {}
    if(!quota || quota > size * 1.2){
      const iw = new FcIdbWriter();
      try { await iw.open(); writer = iw; } catch(e){ lastErr = e; }
    }
  }
  if(!writer){
    const dm = navigator.deviceMemory || 2;
    const cap = dm >= 8 ? 768 * 1048576 : 256 * 1048576;
    if(size <= cap){ writer = new FcMemWriter(); await writer.open(); }
  }
  if(!writer){
    note("这个浏览器不支持页内加速所需的能力（" + (lastErr ? lastErr.message : "存储空间不足") + "），请改用普通下载按钮。");
    return;
  }
  FC("fc-badge").textContent = "通道：" + writer.kind;
  FC("fc-badge").classList.remove("hidden");
  note("通道找好了（" + writer.kind + "），正在下载——保持这个页面打开，下完点保存。");

  const state = { cancelled: false, writer };
  fcCurrent = state;
  FC("fc-cancel").onclick = async () => {
    state.cancelled = true;
    try { await writer.cleanup(); } catch {}
    if(fcCurrent === state) fcCurrent = null;
    note("已取消，临时数据已清理。");
    FC("fc-cancel").classList.add("hidden");
  };

  const SEG = 4 * 1048576, CONC = 6;
  const nSeg = Math.max(1, Math.ceil(size / SEG));
  let next = 0, doneBytes = 0, doneSegs = 0;
  const t0 = Date.now();
  const samples = [];
  const timer = setInterval(() => {
    const now = Date.now();
    samples.push({ t: now, b: doneBytes });
    while(samples.length > 2 && now - samples[0].t > 3000) samples.shift();
    let cur = 0;
    if(samples.length > 1){ const dt = (now - samples[0].t) / 1000; if(dt > 0) cur = (doneBytes - samples[0].b) / dt; }
    const el = Math.round((now - t0) / 1000);
    FC("fc-fill").style.width = (size ? (doneBytes / size * 100) : 100) + "%";
    FC("fc-pct").textContent = size ? (doneBytes / size * 100).toFixed(1) + "%" : "—";
    FC("fc-got").textContent = fmtSize(doneBytes) + " / " + fmtSize(size);
    FC("fc-cur").textContent = doneSegs >= nSeg ? "—" : fmtSize(cur) + "/s";
    FC("fc-avg").textContent = el > 0 ? fmtSize(doneBytes / el) + "/s" : "—";
    FC("fc-time").textContent = el + "s";
    FC("fc-seg").textContent = doneSegs + " / " + nSeg;
  }, 250);

  async function fetchSeg(idx){
    const start = idx * SEG, end = Math.min(size, start + SEG) - 1;
    let lastE = null;
    for(let a = 0; a < 3; a++){
      if(state.cancelled) throw new Error("cancelled");
      try {
        const r = await fetch(f.url, { headers: { Range: `bytes=${start}-${end}` }, cache: "no-store" });
        if(r.status !== 206) throw new Error("HTTP " + r.status);
        const buf = await r.arrayBuffer();
        const bufLen = buf.byteLength; // 必须在 writeAt（transfer 过户）之前取
        if(bufLen !== end - start + 1) throw new Error(`段长度不对 ${bufLen} != ${end - start + 1}`);
        await writer.writeAt(start, buf);
        doneBytes += bufLen; doneSegs++;
        return;
      } catch(e){ lastE = e; }
    }
    throw lastE || new Error("段下载失败");
  }
  async function lane(){ while(true){ if(state.cancelled) return; const i = next++; if(i >= nSeg) return; await fetchSeg(i); } }

  try {
    await Promise.all(Array.from({ length: Math.min(CONC, nSeg) }, lane));
    if(state.cancelled) return;
    clearInterval(timer);
    FC("fc-fill").style.width = "100%";
    FC("fc-pct").textContent = "100%";
    FC("fc-got").textContent = fmtSize(size) + " / " + fmtSize(size);
    FC("fc-seg").textContent = nSeg + " / " + nSeg;
    const rawFile = await writer.getFile(f.name, f.mime || guessMime(f.name));
    const saveBlob = new Blob([rawFile], { type: "application/octet-stream" });
    const objUrl = URL.createObjectURL(saveBlob);
    const saveAs = (name) => () => {
      const a = document.createElement("a");
      a.href = objUrl; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    };
    const sb = FC("fc-save");
    sb.classList.remove("hidden");
    sb.onclick = saveAs(f.name);
    const sbAlt = FC("fc-save-alt");
    sbAlt.classList.remove("hidden");
    sbAlt.onclick = () => {
      saveAs(f.name + ".dl")();
      note("已经开始存了，等它下完，然后改个名就能看（跟着做）：① 打开手机自带的「文件管理」 ② 找到刚下好的文件（名字最后多了 .dl） ③ 长按这个文件，点「重命名」 ④ 把最后的 .dl 删掉，让结尾变成 .mp4 ⑤ 搞定！点开就能播放了");
    };
    const cb = FC("fc-clean");
    cb.classList.remove("hidden");
    cb.onclick = async () => { try { await writer.cleanup(); } catch {} if(fcCurrent === state) fcCurrent = null; note("临时文件已清理。"); cb.classList.add("hidden"); };
    FC("fc-cancel").classList.add("hidden");
    state.done = true;
    note("✅ 下载完成！点蓝色的「保存文件」就能存到手机。QQ 浏览器的兄弟注意：如果你点了保存、下载却卡住不动，就改点橙色的「备用保存」——它存下来的文件要改个名才能看，点完备用保存我会一步步教你改，很简单。");
  } catch(e){
    clearInterval(timer);
    if(state.cancelled) return;
    note("加速下载失败：" + (e && e.message ? e.message : e) + "。可重试，或改用普通下载。");
    try { await writer.cleanup(); } catch {}
    if(fcCurrent === state) fcCurrent = null;
    FC("fc-cancel").classList.add("hidden");
  }
}

boot();
</script>
</body>
</html>
